// Scan point identity: token exchanged once for a client certificate, and
// later rotation. ADR-018.
//
// The trust anchor is configuration, not an assumption baked into the binary,
// so this flow is byte-identical in SaaS and on-prem. That is the whole point
// of ADR-018 -- a second enrollment path in the most security-sensitive
// component is exactly where ADR-017's single-codebase commitment would fail.

syntax = "proto3";

package cybersentinel.scanpoint.v1;

import "cybersentinel/scanpoint/v1/common.proto";

service Enrollment {
  // One-time. Token exchanged for a client certificate.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  rpc RotateCertificate(RotateRequest) returns (EnrollResponse);
}

message EnrollRequest {
  // Issued by an operator, single use, and carries the zone this scan point is
  // being enrolled into. The zone is deliberately not a field on this message:
  // a scan point must not be able to influence its own vantage point, because
  // exposure is derived from the zone an observation was made from (ADR-008).
  string enrollment_token = 1;

  // PKCS#10 DER. Core signs; it never generates the key pair.
  //
  // The private key never leaving the scan point is what makes
  // cert_fingerprint a real per-device identity rather than a label -- and
  // that identity is what the audit log, CREDENTIAL_GRANT.delivered_to_
  // fingerprint (ADR-020) and immediate per-device revocation all rest on.
  bytes csr = 2;

  string hostname = 3;  // SCAN_POINT.hostname
  string agent_version = 4;
  string protocol_version = 5;

  // Declared here as well as on Hello so Core can populate
  // SCAN_POINT_CAPABILITY at enrollment, and so a build outside the supported
  // version window is refused now, with an operator-facing message, rather
  // than enrolling cleanly and failing mysteriously at the first Connect.
  // Mysterious failure inside a network we cannot observe is the thing
  // ADR-022 exists to prevent.
  repeated Capability capabilities = 6;
}

// Returned by both Enroll and RotateCertificate. One message for both is
// deliberate: rotation produces exactly what enrollment produces, and a scan
// point that has just rotated needs the endpoints and version window
// re-confirmed for the same reasons a new one does.
message EnrollResponse {
  string scan_point_id = 1;

  bytes certificate = 2;  // signed leaf, DER

  // Core states its own chain rather than the binary assuming one. This is the
  // concrete form of ADR-018's "trust anchor is configuration": the same code
  // enrolls against our SaaS CA and against a customer's on-prem Core.
  repeated bytes ca_chain = 3;

  // Derivable from the DER, and present anyway. The 90-day lifetime with
  // rotation at 60 is a comparison the scan point makes on a timer; making it
  // parse a certificate to decide when to rotate turns a scheduling decision
  // into an X.509 dependency.
  int64 not_after_unix = 4;

  // SCAN_POINT.cert_fingerprint. The scan point's identity in the audit log,
  // returned so it can name itself in local diagnostics that Core will later
  // have to correlate (ADR-018).
  string cert_fingerprint = 5;

  // The four ADR-005 services share a posture and a client certificate, but
  // not a connection -- that separation is what keeps a multi-MB rule pack or
  // a long result upload from head-of-line blocking job dispatch. Core hands
  // back where each one lives so that moving ingest onto its own hosts is a
  // Core-side change, not a configuration push to every scan point in a fleet
  // running months-old builds.
  string dispatch_endpoint = 6;
  string ingest_endpoint = 7;
  string rulepacks_endpoint = 8;

  // The supported version window, stated at enrollment as well as on
  // ServerHello, so a build outside it learns why before it has an identity
  // rather than after (ADR-022).
  string accepted_protocol_version = 9;
  string min_supported_version = 10;
}

message RotateRequest {
  string scan_point_id = 1;

  bytes csr = 2;  // new key pair, new CSR

  // No enrollment token: ADR-018 says the token is exchanged exactly once.
  // Rotation authenticates with the certificate being replaced, over the mTLS
  // connection itself.
  //
  // This field is defence in depth on top of that. Core compares it against
  // the TLS peer certificate and refuses a mismatch, so a rotation body
  // captured from one scan point cannot be replayed to re-key another.
  string current_fingerprint = 3;

  string agent_version = 4;
  string protocol_version = 5;

  // Re-declared because rotation is when an upgraded agent restates what it
  // can do. Engines are replaced independently of the runtime under ADR-027,
  // so the capability set at rotation is routinely not the set at enrollment.
  repeated Capability capabilities = 6;
}
