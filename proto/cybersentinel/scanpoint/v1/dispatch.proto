// The long-lived bidirectional stream. Jobs, leases, credentials, capability
// negotiation, cancellation and the kill switch. ADR-005, ADR-004.
//
// The scan point always initiates. Core never opens a connection into a
// customer network, in any deployment mode, for any reason.
//
// Results do not travel here -- they go to Ingest (ADR-026), and rule pack
// bodies go to RulePacks (ADR-019). Both are bulk, and bulk on this stream
// head-of-line blocks job assignment behind it.

syntax = "proto3";

package cybersentinel.scanpoint.v1;

import "cybersentinel/scanpoint/v1/common.proto";
import "cybersentinel/scanpoint/v1/rulepacks.proto";

service Dispatch {
  // Long-lived bidirectional stream. Scan point always initiates.
  rpc Connect(stream ScanPointMessage) returns (stream CoreMessage);
}

message ScanPointMessage {
  oneof msg {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    LeaseRenewal lease_renewal = 3;
    JobProgress progress = 4;
    JobTerminal terminal = 5;
    Backpressure backpressure = 6;
    KillAck kill_ack = 7;
    RulePackStatus rule_pack_status = 8;
    CancelAck cancel_ack = 9;
  }
}

message CoreMessage {
  oneof msg {
    JobAssignment job = 1;
    LeaseGrant lease = 2;
    CancelJob cancel = 3;
    RulePackUpdate rule_pack = 4;
    CredentialGrant credential = 5;
    KillSwitch kill = 6;
    ServerHello server_hello = 7;
  }
}

// ---------------------------------------------------------------------------
// Handshake
// ---------------------------------------------------------------------------

message Hello {
  // An echo, not an identity. Every value on this stream originates in a
  // network whose compromise the threat model assumes (ADR-020). Core MUST
  // resolve the scan point from the TLS peer certificate fingerprint
  // (ADR-018), and MUST close the stream when this value names a different
  // one rather than trusting it or quietly preferring the certificate: a
  // mismatch is either our bug or someone's attempt, and both need an
  // operator to see it.
  string scan_point_id = 1;

  string protocol_version = 2;  // additive-only within major
  string agent_version = 3;

  // Self-asserted; see Capability. It can only narrow what Core dispatches,
  // never widen it. Core MUST intersect this with what this scan point is
  // independently authorised to run, so that claiming a capability cannot
  // obtain work the scan point is not permitted to do.
  repeated Capability capabilities = 4;

  // Offline import means packs arrive out-of-band (ADR-019), so Core cannot
  // infer what is loaded from what it has sent.
  repeated LoadedRulePack loaded_packs = 5;
}

message ServerHello {
  string accepted_protocol_version = 1;
  string min_supported_version = 2;

  // Operator-facing, not a bare status. A scan point outside the supported
  // window is told so in words an operator can act on; closing the stream with
  // a status code is the mysterious failure ADR-022 rejects, in a network we
  // cannot reach to diagnose.
  string deprecation_notice = 3;
}

// ---------------------------------------------------------------------------
// Job assignment
// ---------------------------------------------------------------------------

message JobAssignment {
  string job_id = 1;
  string engine = 2;
  int64 lease_epoch = 3;  // fencing token, monotonic
  int64 lease_expires_unix = 4;
  bool reassign_safe = 5;  // governs retry, never retention (ADR-026)
  ScanConstraints constraints = 6;
  repeated Task tasks = 7;

  // Credentialed-host jobs (engine "host"), ADR-091. Both fields are NON-SECRET
  // and travel with the assignment rather than with the CredentialGrant that
  // follows it: cred_user is the username column of the credential profile
  // (migration 0042) and known_hosts is public key material by definition. The
  // grant still carries the only secret on the wire.
  //
  // cred_user is the account the runtime's signing agent authenticates as. A
  // host job that arrives without one is refused by the runtime (ENGINE_FAILURE
  // with the reason in detail) rather than guessed at.
  string cred_user = 8;

  // known_hosts is the host-key trust material the engine verifies the target
  // against, in the shape internal/hostkeytrust defines: a first line
  // "# cvap-trust-source: operator" or "# cvap-trust-source: observed", then
  // known_hosts lines or SHA256 fingerprints. The header is what makes the
  // sender's claim explicit — an operator-pinned trust root on the credential
  // profile versus the fingerprint CVAP itself observed for the target on
  // discovery — so the receiving side enforces the refusal against the claim and
  // Core's audit event (credential.granted) records the same word.
  //
  // Trust-on-first-use is not a mode. A value with no material after the
  // header, or with no header, is refused by the runtime before any engine
  // process exists; Core refuses to compose one at all. Absent (an older Core)
  // reads as "no material", which is the refusal, not a permission.
  string known_hosts = 9;
}

message Task {
  string task_id = 1;
  string target = 2;

  // Core-held asset attribute the scan point cannot derive; caps rate
  // regardless of policy. Fragility belongs to the device, not to the scan, so
  // it must apply to every scan that ever touches it -- including one written
  // by someone who has never heard of that device (ADR-024).
  bool fragile = 3;
}

message ScanConstraints {
  uint32 max_rate_pps = 1;
  uint32 max_rate_per_target = 2;

  // safe | intrusive. The EFFECTIVE mode, already reduced by Core.
  //
  // ADR-021 gives the policy a ceiling and the scan an opt-in beneath it, and
  // what travels is the lower of the two. A scan point never sees which half
  // produced the value, deliberately: a policy left on intrusive after a test
  // window is exactly the failure ADR-021 was written against, and a wire field
  // carrying the ceiling rather than the choice would put that failure back on
  // the network.
  string safety_mode = 3;

  // Enforced again scan-point side. Scope enforcement is duplicated on purpose
  // and lives at exactly two sites -- Core at planning, the scan point runtime
  // on the send path. Never in an engine: engines receive resolved,
  // pre-authorised targets and send anything discovered mid-scan back to the
  // runtime for authorisation (ADR-024, ADR-027).
  repeated string exclusions = 4;

  // When this job's authorised window closes, or 0 when the policy sets no
  // window at all. Derived from scan_policies.time_windows, which Core
  // evaluates; the recurring schedule never travels.
  //
  // Absent means UNRESTRICTED, which is the opposite convention to
  // allowed_targets below. The asymmetry is deliberate and ADR-037 records it:
  // this field answers "is this scan restricted in time", and an unset
  // restriction is no restriction; allowed_targets answers "where may this scan
  // reach", and the safe answer to an unset question is nowhere. One enumerates
  // constraint, the other enumerates permission.
  //
  // A runtime that reaches this instant MUST stop sending and terminate with
  // WINDOW_EXPIRED. Core will not have dispatched the job at all if the window
  // was already closed when it was claimed.
  int64 window_ends_unix = 5;

  // Allowlist; exclusions take precedence. Without this the scan-point check
  // authorises anything not denied, which is not a scope check.
  //
  // EMPTY MEANS DENY ALL, and empty is the same as absent -- proto3 cannot
  // distinguish them, so they must not mean different things. A runtime that
  // receives no allowed targets MUST send nothing and fail the task; it MUST
  // NOT read the absence as "no filter configured". For a field whose other
  // reading is "scan anything", the safe reading is the only defensible one.
  //
  // This describes behaviour that exists rather than an intention. Core
  // enforces the same rule at planning: every task target is compared against
  // this list before the job is assigned, and a job whose policy has no allow
  // rules is refused with an audit event rather than dispatched (ADR-024
  // control 1, site one). Neither side trusts the other, which is why both
  // sides read the empty list the same way.
  repeated string allowed_targets = 6;

  uint32 fragile_rate_pps = 7;

  // ADR-024 control 2, lower-only: a policy may reduce this and may never raise
  // it. A separate lever from max_rate_per_target rather than a derivative of
  // it, because concurrent connections rather than packet rate are what tip a
  // printer or an embedded device over -- a host answering 20 simultaneous
  // connects at 5 pps is under more pressure than one answering 1 at 50.
  uint32 max_concurrent_per_target = 8;

  uint32 connect_timeout_ms = 9;
}

// ---------------------------------------------------------------------------
// Liveness and flow control, scan point to Core
// ---------------------------------------------------------------------------

// Sent every 30 s; Core times out at 90 s.
//
// Liveness plus the small set of numbers that are invisible between jobs.
// Anything job-scoped belongs on JobProgress, and anything about a single
// failure belongs on JobTerminal.
message Heartbeat {
  int64 sent_at_unix = 1;
  uint32 active_jobs = 2;

  // Depth of the local durable buffer (ADR-026), bounded at 500 MB / 24 h.
  //
  // The heartbeat is the only always-flowing channel, so it is the only place
  // Core can see a scan point approaching that ceiling rather than learning
  // about it once data starts being shed. A buffer filling inside a customer
  // network is invisible to us by construction; this is what makes it visible.
  uint32 buffered_submissions = 3;
  uint64 buffered_bytes = 4;

  // Measured aggregate send rate. An attestation, not a control -- the same
  // standing as JobTerminal.credentials_zeroised.
  //
  // A scan point that is sending faster than its ceiling can report any number
  // here, and nothing in this field slows it down. ADR-024's bound is enforced
  // where it can be: Core bounds the aggregate at planning, and the scan point
  // runtime enforces it on the send path. This exists to catch our own bugs --
  // a rate limiter that is wrong is otherwise invisible until a customer
  // notices -- which is the argument ADR-024 gives for requiring KillAck.
  //
  // Core MUST treat a value it dislikes as an operator signal about a possibly
  // faulty scan point, never as the rate that was actually sent.
  uint32 observed_rate_pps = 5;

  // Engine process restarts since this connection opened. An engine that
  // crashes inside a job surfaces as ENGINE_FAILURE; one that flaps between
  // jobs (ADR-027) is otherwise invisible until throughput is already gone.
  uint32 engine_restarts = 6;
}

// A request to continue, not a claim of continuation.
//
// The epoch is the fencing check (ADR-012). If Core has issued a higher one,
// the renewal is refused and the scan point must self-abort and zeroise
// credentials (ADR-020) rather than continue optimistically.
message LeaseRenewal {
  string job_id = 1;
  int64 lease_epoch = 2;  // the epoch the scan point believes it holds
  int64 renewed_at_unix = 3;

  // Deliberately no requested duration. TTL is Core's -- 60 s with renewal at
  // 20 s -- and letting the scan point ask for longer would let a compromised
  // one extend the window in which credential material lives in its memory,
  // which is exactly the bound that makes ADR-020's memory-only model mean
  // anything.
}

message JobProgress {
  string job_id = 1;
  int64 lease_epoch = 2;

  // Counts rather than a percentage. The task is the unit of attribution
  // (ADR-011), and "3 of 254 failed" is what an operator acts on; a percentage
  // is derived and discards the part that matters.
  uint32 tasks_total = 3;
  uint32 tasks_completed = 4;
  uint32 tasks_failed = 5;

  uint32 observations_emitted = 6;
  int64 reported_at_unix = 7;

  // The rate actually in effect. ADR-024's rate limiting is adaptive during
  // execution, and without this a scan running at 40 pps under a 1,000 pps
  // ceiling looks identical to a broken one -- when in fact the fragile-device
  // guard fired, which is the whole explanation for the duration.
  uint32 current_rate_pps = 8;
}

// The job ended. Notification only: the results themselves go to Ingest.
message JobTerminal {
  string job_id = 1;
  int64 lease_epoch = 2;
  TerminationReason reason = 3;

  // The join between the two streams. Dispatch learns the job ended; Ingest
  // receives the results. Without the submission_id, "terminal seen, results
  // never arrived" is indistinguishable from "results still uploading", and
  // only one of those needs an operator.
  string submission_id = 4;

  // Marked, submitted, never discarded (ADR-026). A job that lost its lease
  // has already put packets on the wire, and the partial record is the only
  // account of what it touched.
  bool incomplete = 5;

  uint32 tasks_completed = 6;
  uint32 tasks_failed = 7;
  int64 ended_at_unix = 8;

  // Operator-facing detail: which engine failed, which target halted the scan.
  string detail = 9;

  // An attestation, not a control.
  //
  // A compromised scan point can set this and lie, and nothing here would
  // catch that. It exists to catch our own bugs: ADR-020 requires zeroisation
  // on completion, lease loss and abort, and an invariant that nothing ever
  // asserts is an invariant nothing notices the loss of. Core raises an audit
  // event naming the scan point when a JobTerminal arrives without it set --
  // an unchecked field would be worse than no field at all.
  bool credentials_zeroised = 10;
}

// Scan-point-initiated flow control (ADR-026).
//
// This is the half that throttles job assignment. SubmitAck.retry_after_ms is
// the other half and throttles the upload. Only this one can stop the buffer
// growing, because only dispatch can stop Core handing out more work -- which
// is why an ingest-side signal alone would not be flow control at all.
message Backpressure {
  BackpressureState state = 1;
  uint32 buffered_submissions = 2;
  uint64 buffered_bytes = 3;
  uint32 suggested_pause_ms = 4;
  int64 reported_at_unix = 5;
}

enum BackpressureState {
  BACKPRESSURE_STATE_UNSPECIFIED = 0;
  BACKPRESSURE_STATE_OK = 1;    // recovered; resume normal assignment
  BACKPRESSURE_STATE_SOFT = 2;  // assign fewer jobs
  BACKPRESSURE_STATE_HARD = 3;  // assign nothing; buffer near its ceiling
}

message KillAck {
  string kill_id = 1;
  int64 acked_at_unix = 2;
  uint32 tasks_halted = 3;
}

// The answer to CancelJob, and the same argument as KillAck.
//
// ADR-024 requires KillAck because "a 10-second bound Core cannot measure is
// not a control". That argument does not weaken when the blast radius narrows:
// an operator who cancels one runaway scan and cannot tell whether it stopped
// has a button, not a control. Without this, "cancellation sent" was the last
// thing Core knew, and a scan point that dropped the message looked identical
// to one that halted.
//
// Idempotent at Core: a scan point that reconnects and acks again produces no
// second row, or "how many acknowledged" stops meaning anything.
message CancelAck {
  string job_id = 1;

  // The incarnation that was halted, echoed from CancelJob. A cancellation
  // acknowledged under a stale epoch halted work Core was no longer asking
  // about, and an operator needs to see that rather than count it.
  int64 lease_epoch = 2;

  int64 acked_at_unix = 3;
  uint32 tasks_halted = 4;
}

// ---------------------------------------------------------------------------
// Leases, cancellation and the kill switch, Core to scan point
// ---------------------------------------------------------------------------

// Core's answer to a LeaseRenewal, and the vehicle for revoking a lease
// unsolicited.
//
// Revocation is sent, not waited for. ADR-005 rejected long-polling precisely
// because lease revocation, cancellation and the kill switch would then arrive
// only at poll boundaries, when being immediate is their entire value.
message LeaseGrant {
  string job_id = 1;

  // Authoritative, and may exceed the epoch the scan point asked with.
  int64 lease_epoch = 2;

  int64 lease_expires_unix = 3;
  LeaseState state = 4;
  string detail = 5;  // operator-facing on loss
}

enum LeaseState {
  LEASE_STATE_UNSPECIFIED = 0;

  // Renewed; continue.
  LEASE_STATE_GRANTED = 1;

  // Superseded or expired. Self-abort, zeroise credentials, mark results
  // incomplete, submit them (ADR-012, ADR-020, ADR-026).
  //
  // Stated explicitly rather than left to a renewal timeout: it fires the
  // self-abort deterministically and shortens the window credential material
  // sits in memory. ADR-022 wants comprehensible failure over silence.
  LEASE_STATE_LOST = 2;

  // Core has no record of this job -- after a Core restart, or after a scan
  // point returns from a long outage. Same self-abort, different operator
  // message, and worth distinguishing because one of the two means Core lost
  // state and the other does not.
  LEASE_STATE_UNKNOWN_JOB = 3;
}

// Per-scan immediate cancellation, distinct from the global kill switch
// (ADR-024).
message CancelJob {
  string job_id = 1;

  // Cancels the incarnation Core means, not whatever is running under that
  // job id after a reassignment.
  int64 lease_epoch = 2;

  string reason = 3;  // operator-facing; surfaces in the audit log

  // The runtime's SIGTERM-then-SIGKILL window for engine processes. ADR-027
  // fixes the mechanism and not the number, so setting it here lets an
  // operator cancel an intrusive job harder without a fleet redeploy. Still
  // bounded by ADR-024's 10 s propagation guarantee.
  uint32 grace_ms = 4;

  // Deliberately no "discard results" option.
  //
  // ADR-026 is unambiguous: results are always persisted and submitted, and
  // §11's ABORT node is corrected to zeroise, mark incomplete, submit. A wire
  // field that could switch that off would make the invariant negotiable by
  // whoever controls Core -- and the partial record is exactly the "what did
  // we touch" evidence ADR-012's operator escalation exists to serve.
}

message KillSwitch {
  string kill_id = 1;

  // Mirrors kill_switches.scope: how much of what this scan point holds the
  // operator meant to stop.
  //
  // Core does the narrowing and this field reports it. A kill is delivered only
  // to the scan points it covers -- a zone kill reaches the zone, a scan kill
  // reaches the scan points holding that scan's jobs -- so a runtime never has
  // to decide whether a kill applies to it. What it still has to decide is how
  // much to halt, and without this field there was no way to say: a per-scan
  // kill and a tenant-wide kill arrived as the same message, so the only
  // correct reading was the widest one, and a narrow kill halted the whole
  // scan point.
  //
  // KILL_SCOPE_SCAN halts nothing on its own. The jobs it covers arrive
  // individually as CancelJob, which names the job and the epoch; this message
  // tells the runtime that a wholesale halt is NOT what was asked for.
  //
  // EVERY scope is still acknowledged with KillAck, including one that halts
  // nothing. The ack measures RECEIPT, not halting: ADR-024 bounds propagation
  // at 10 s and requires the bound to be measurable, and a scope that a runtime
  // decides needs no answer is a scope whose propagation Core cannot measure at
  // all. tasks_halted = 0 is the correct answer for a scan-scoped kill and is
  // not the same as silence.
  //
  // UNSPECIFIED means halt everything. An older Core does not set this field,
  // and proto3 renders that as the zero value -- so the zero value has to be
  // the reading that was correct before the field existed (ADR-022).
  KillScope scope = 2;
}

// Scoped kills narrow how much a runtime halts. They do NOT narrow the
// obligation to acknowledge -- see KillSwitch.scope.
enum KillScope {
  // Halt everything. Also what an older Core, which does not set the field,
  // will appear to have sent.
  KILL_SCOPE_UNSPECIFIED = 0;

  KILL_SCOPE_TENANT = 1;  // every scan point in the tenant
  KILL_SCOPE_ZONE = 2;    // one vantage point
  KILL_SCOPE_SCAN = 3;    // one scan's jobs; see CancelJob
}

// ---------------------------------------------------------------------------
// Credentials
// ---------------------------------------------------------------------------

// Just-in-time, scoped to this job's targets, short TTL, memory only (ADR-020).
//
// Never a bulk sync of the credential store. A scan point sits in the network
// whose compromise the threat model assumes, so what it holds must be bounded
// to the jobs in flight and the remaining seconds of their TTL.
message CredentialGrant {
  string grant_id = 1;
  string job_id = 2;
  int64 expires_unix = 3;  // short TTL

  // Memory only, zeroised on completion, lease loss or abort. Never written to
  // disk on a scan point: anything on disk survives the process, and the
  // decryption key would have to be on that host too, which converts a
  // memory-scraping attack into a file read.
  //
  // Stops at the runtime. Engine processes receive a session handle or a
  // short-lived derived token, never this (ADR-027).
  //
  // The marker below is intent, not a mechanism. protobuf-go v1.36.6 consults
  // debug_redact nowhere in its encoding path, so String() on this message --
  // or on the CoreMessage carrying it in its oneof -- still renders the
  // material in full, and internal/logging redacts on the attribute key and
  // cannot see inside a value a type rendered for it. Log either message only
  // through logging.Proto(), and never install a payload-logging interceptor
  // on Dispatch. .github/scripts/check_secret_logging.py enforces the first
  // mechanically; the second is a human review obligation.
  bytes material = 4 [debug_redact = true];

  repeated string scope = 5;  // targets this may be used against

  // Never overload material. The preferred secret-free mechanisms carry
  // structurally different bytes, and one opaque field meaning different
  // things per protocol is exactly the semantic drift ADR-022 forbids.
  CredKind cred_kind = 6;
}

enum CredKind {
  CRED_KIND_UNSPECIFIED = 0;
  SESSION_HANDLE = 1;
  KERBEROS_TICKET = 2;
  SSH_CERT = 3;
  DERIVED_TOKEN = 4;
  RAW_SECRET = 5;
}
