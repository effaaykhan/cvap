name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.23"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy is committed
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

  proto:
    name: Wire contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # buf breaking needs the base branch present to compare against.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install the pinned protobuf toolchain
        run: make proto-tools

      - name: Lint
        run: make proto-lint

      # ADR-022: proto/ is additive-only within a major version. Scan points in
      # customer networks run months-old builds, so a removed or renumbered
      # field is a fleet-wide outage in networks we cannot observe or fix. This
      # is what enforces that mechanically rather than by review -- a reviewer
      # who has read the ADR still has to notice a renumbered field in a large
      # diff, and eventually will not.
      #
      # Compared against the merge base, not HEAD: a break that is already
      # committed on the branch compares clean against itself.
      - name: Additive-only check
        run: make proto-breaking PROTO_BASELINE=".git#ref=origin/${{ github.base_ref || 'main' }}"

      # gen/ is committed and must match proto/. Stops a hand-edited .pb.go and
      # stops a .proto change landing without its bindings.
      - name: Generated bindings match
        run: make proto-verify

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec ./...

  licences:
    name: Dependency licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # GPL/AGPL are out of bounds under ADR-025. LGPL and MPL are permitted,
      # which is why this is an explicit deny list rather than a classifier.
      - name: Check licences
        run: python3 .github/scripts/check_licences.py

  config:
    name: Claude config frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # A malformed agent or skill file is silently skipped at load time, so
      # the review subagent you think is running simply is not.
      - name: Validate agent and skill frontmatter
        run: python3 .github/scripts/check_frontmatter.py

      # .gitignore was once overwritten wholesale, silently dropping four
      # categories of entry. This is what makes the next one loud.
      - name: .gitignore regression
        run: python3 .github/scripts/check_gitignore.py

      # The scope guard is the control that stops a development scan reaching a
      # real network. It gets a test table, not trust.
      - name: Lab scope guard
        run: python3 .claude/hooks/test_lab_scope_guard.py

      # The contract guard was extended from file paths to Bash commands
      # because a heredoc was a straight path through it. An extension like
      # that is exactly the kind that looks done and is not, so it gets a case
      # table too.
      - name: Frozen contract guard
        run: python3 .claude/hooks/test_protect_contracts.py
