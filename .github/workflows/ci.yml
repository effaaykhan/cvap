name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy is committed
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

      # The version-comparator oracle differential (ADR-062): compare our dpkg/rpm
      # comparators against the distributions' OWN libraries. dpkg is native on the
      # runner; python3-rpm provides librpm. CVAP_REQUIRE_VERCMP_ORACLE=1 turns the
      # "tool absent" skip into a failure, so here the differential MUST run — the
      # same shape as CVAP_REQUIRE_LAB. A silent-false-negative comparator is the
      # one bug this product cannot detect in itself, so its validation is a gate,
      # not opportunistic.
      - name: Version comparator oracle (dpkg + librpm differential)
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg rpm python3-rpm
          CVAP_REQUIRE_VERCMP_ORACLE=1 go test ./internal/version/ -run Oracle -count=1 -v

  proto:
    name: Wire contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # buf breaking needs the base branch present to compare against.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install the pinned protobuf toolchain
        run: make proto-tools

      - name: Lint
        run: make proto-lint

      # ADR-022: proto/ is additive-only within a major version. Scan points in
      # customer networks run months-old builds, so a removed or renumbered
      # field is a fleet-wide outage in networks we cannot observe or fix. This
      # is what enforces that mechanically rather than by review -- a reviewer
      # who has read the ADR still has to notice a renumbered field in a large
      # diff, and eventually will not.
      #
      # The baseline has to be a commit that does NOT already contain the change
      # under test, and there are two different ways to get one.
      #
      # On a pull request that is the base branch, github.base_ref. On a push
      # there is no base_ref at all, and the previous form fell back to the
      # literal 'main' -- which after checkout resolves to the very commit being
      # tested. buf then compared the contract against itself and reported it
      # clean, every time, for any change. The gate passed on the commit that
      # deleted RotateRequest field 3 (see ADR-028) without reporting the
      # deletion, which is how it was found: a gate that cannot fail is worse
      # than no gate, because the first one gets trusted.
      #
      # So on a push the baseline is github.event.before -- what the branch
      # pointed at before this push -- which checks the whole push rather than
      # only its last commit. Branch creation reports an all-zero before, and a
      # workflow_dispatch has no push event at all; both fall back to HEAD~1.
      #
      # Values arrive through env rather than ${{ }} interpolation into the
      # script. Neither is attacker-controlled here, but a ref interpolated
      # straight into a shell line is a script-injection shape, and this
      # repository does not get to keep those.
      - name: Additive-only check
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          zero=0000000000000000000000000000000000000000
          if [ -n "$BASE_REF" ]; then
            baseline="origin/$BASE_REF"
            why="the base branch of this pull request"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$zero" ]; then
            baseline="$BEFORE_SHA"
            why="what this branch pointed at before the push"
          elif git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            baseline="HEAD~1"
            why="the previous commit; no usable push event"
          else
            echo "No baseline: HEAD has no parent. Expected only at the very"
            echo "first commit in the repository."
            exit 0
          fi
          echo "Additive-only baseline: $baseline ($why)"
          if [ "$(git rev-parse "$baseline")" = "$(git rev-parse HEAD)" ]; then
            echo "Baseline resolved to HEAD. buf would compare the contract"
            echo "against itself and pass whatever the change was. Refusing."
            exit 1
          fi
          make proto-breaking PROTO_BASELINE=".git#ref=$baseline"

      # gen/ is committed and must match proto/. Stops a hand-edited .pb.go and
      # stops a .proto change landing without its bindings.
      - name: Generated bindings match
        run: make proto-verify

  # Tenant isolation was verified only on the author's machine until this job
  # existed. That is the same category of gap as a gate that cannot fail: the
  # assertions were real, but nothing ran them on anyone else's change.
  schema:
    name: Schema and tenant isolation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cvap
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: cvap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cvap -d cvap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The MIGRATION role: owns the schema, may bypass RLS.
      DATABASE_URL: postgres://cvap:ci-only-not-a-secret@127.0.0.1:5432/cvap?sslmode=disable
      # The APPLICATION role: a LOGIN member of cvap_app, holds neither
      # BYPASSRLS nor SUPERUSER. Running the store tests as the migration role
      # would pass every assertion while proving nothing, which is why
      # store.Open refuses such a role outright.
      APP_DATABASE_URL: postgres://cvap_app_login:cvap_dev_only_app_password@127.0.0.1:5432/cvap?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # up, down -all, up again. The second up is what catches a down migration
      # that left an object behind — a summary "verify passed" would not.
      #
      # This runs against a THROWAWAY database, not $DATABASE_URL, so it proves
      # the migrations apply from nothing rather than from whatever the target
      # happened to hold. That is why the step below exists: verify no longer
      # leaves a schema behind for the rest of the job to use.
      - name: Migrations apply, reverse and reapply
        run: make migrate-verify

      - name: Apply migrations to the job database
        run: make migrate-up

      # cvap_app is NOLOGIN by design: it is a group role carrying the grants,
      # with no password to leak or rotate. What connects is a LOGIN member of
      # it. In production this is provisioning's job; here it is this file.
      - name: Create the application login role
        run: make app-role

      # Four cases: filtered reads across every tenant-scoped table, an unset
      # tenant context RAISING rather than returning nothing, cross-tenant
      # writes refused by WITH CHECK on all 40 policies, and a composite FK
      # refusing a cross-tenant parent.
      - name: Tenant isolation
        run: make rls-test

      # The Go half of the same property: the store destroys rather than recycles
      # any connection whose transaction did not end where inTx decided it did.
      #
      # -race is not optional here. Conn.done is an atomic.Bool because a
      # callback may start a goroutine that outlives it, and until this ran, that
      # fix was reasoned rather than demonstrated. "Reasoned rather than
      # demonstrated" is precisely the gap the two tenant-context bugs sat in, so
      # it does not get to persist in the fix for them.
      #
      # These tests skip without CVAP_TEST_DATABASE_URL, which is why they cannot
      # simply live in build-test: that job has no database. This job has one.
      - name: Store integration tests (race detector)
        run: make store-test GOTEST_FLAGS=-race

      # The two-process end-to-end suite: real binaries, real TLS, enrolment
      # through to rows in Postgres, plus the two failure modes that only
      # exist across a process boundary — a severed lease discovered at
      # renewal, and an engine subprocess killed from outside.
      - name: End-to-end (two processes, real TLS)
        env:
          CVAP_TEST_DATABASE_URL: postgres://cvap_app_login:cvap_dev_only_app_password@localhost:5432/cvap?sslmode=disable
        run: go test ./test/e2e/... -count=1 -timeout 10m

      # The 10k-asset load test against the published SLOs (§5). CVAP_RUN_LOADTEST
      # is deliberately UNSET here: CI enforces the coarse, order-of-magnitude
      # ceiling only. The precise p95 SLO flakes at the exact threshold on a
      # shared runner, and a gate people mute is worse than no gate — so precise
      # runs where the machine is quiet (a developer's box and the nightly job),
      # never here. The numbers are printed either way (-v), so the trend is
      # visible before it crosses anything. (ci-parity asserts this step exists;
      # ADR-058 records why coarse-in-CI is correct rather than a concession.)
      - name: Load test (coarse SLO ceiling)
        env:
          APP_DATABASE_URL: postgres://cvap_app_login:cvap_dev_only_app_password@localhost:5432/cvap?sslmode=disable
        run: make loadtest

      # Mutation testing lives in THIS job, not the config one, because it now
      # covers Go suites that need a database — and a suite that skips passes,
      # so every mutation it would have killed survives instead. The driver
      # refuses an empty baseline rather than reporting those as survivors, but
      # the right answer is to give it the database.
      #
      # It sabotages each guard's checks one at a time and requires the suite to
      # notice. A surviving mutation fails the build naming the check nothing
      # exercises; it has found a real gap in every session it has run.
      - name: Guard suites actually reach their checks
        env:
          APP_DATABASE_URL: postgres://cvap_app_login:cvap_dev_only_app_password@localhost:5432/cvap?sslmode=disable
        run: make mutate

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Ordered repo-specific gates first, dependency scans last.
      #
      # A step failure ends the job, so whatever runs first decides what the
      # other steps get to say. govulncheck was first, it failed on the Go 1.23
      # standard library, and the secret-logging gate below it had therefore
      # never executed in CI once -- a gate that has never run is not a gate.
      # The checks that are about THIS repository run before the ones that are
      # about the state of the world, because only the first kind can be fixed
      # by the commit under test.
      #
      # continue-on-error is stated explicitly on every step so that this
      # reordering changed the order and nothing else: each of these still fails
      # the build, exactly as before.

      # internal/logging redacts on the attribute key. Generated protobuf types
      # implement String() and render every field, so the enrollment token and
      # credential material are invisible to that redactor. [debug_redact = true]
      # does not help either: protobuf-go consults it nowhere in its encoding
      # path, re-verified at v1.36.11. This is what gives the marker teeth.
      - name: Secret-bearing types never reach a log
        continue-on-error: false
        run: |
          python3 .github/scripts/test_check_secret_logging.py
          python3 .github/scripts/check_secret_logging.py

      # gen/ is excluded, and only gen/.
      #
      # Every finding there was G103 on the one line protoc-gen-go emits per
      # file: protoimpl.X.CompressGZIP(unsafe.Slice(unsafe.StringData(rawDesc),
      # len(rawDesc))). It is not our code and it is not editable -- gen/ is
      # regenerated, and `make proto-verify` fails the build if a committed
      # binding differs by a byte from what the contract generates, so the
      # exclusion cannot hide a hand-edited .pb.go.
      #
      # Scoped to the directory rather than written as a G103 suppression on
      # purpose. `-exclude=G103` would also silence unsafe in hand-written code,
      # which is where an audited-unsafe finding would actually mean something.
      # Hand-written code is currently clean of G103 and must stay checked.
      - name: gosec
        continue-on-error: false
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -exclude-dir=gen ./...

      # Last, because it fails on the state of the world rather than on this
      # commit: a stdlib or dependency advisory published this morning fails a
      # branch that has not changed. That is worth failing on, and it is worth
      # failing on after everything this commit can actually control.
      - name: govulncheck
        continue-on-error: false
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  licences:
    name: Dependency licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # GPL/AGPL are out of bounds under ADR-025. LGPL and MPL are permitted,
      # which is why this is an explicit deny list rather than a classifier.
      - name: Check licences
        run: python3 .github/scripts/check_licences.py

  config:
    name: Claude config frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # A malformed agent or skill file is silently skipped at load time, so
      # the review subagent you think is running simply is not.
      - name: Validate agent and skill frontmatter
        run: python3 .github/scripts/check_frontmatter.py

      # .gitignore was once overwritten wholesale, silently dropping four
      # categories of entry. This is what makes the next one loud.
      - name: .gitignore regression
        run: python3 .github/scripts/check_gitignore.py

      # A .env copied from a stale env.example fails later, in whatever
      # subsystem first reads an empty string, rather than at startup. This is
      # what makes that a build failure instead of a mystery.
      - name: env.example matches what the code reads
        run: python3 .github/scripts/check_env_example.py

      # The scope guard is the control that stops a development scan reaching a
      # real network. It gets a test table, not trust.
      - name: Lab scope guard
        run: python3 .claude/hooks/test_lab_scope_guard.py

      # The contract guard was extended from file paths to Bash commands
      # because a heredoc was a straight path through it. An extension like
      # that is exactly the kind that looks done and is not, so it gets a case
      # table too.
      - name: Frozen contract guard (PreToolUse)
        run: python3 .claude/hooks/test_protect_contracts.py

      # The other half. The PreToolUse guard enumerates ways to spell a write,
      # and a python3 heredoc calling write_text went straight through it --
      # the most common editing method in this repository, unnoticed for as
      # long as the guard existed. This suite performs REAL writes with real
      # interpreters and asks whether a frozen file changed, which is the only
      # question that cannot be worked around. Runners have node, so the node
      # cases that SKIP locally actually run here.
      - name: Frozen contract verifier (PostToolUse)
        run: python3 .claude/hooks/test_verify_contracts.py

      # Three ADRs (048, 049, 050) landed without a row in the index, and only
      # the adr-compliance subagent noticed -- nothing mechanical did. This is
      # symmetric: every docs/adr/NNN-*.md must have an index row and every row
      # must have a file. The next omission is a build failure, not a subagent's
      # good day.
      - name: ADR index is complete
        run: python3 .github/scripts/check_adr_index.py

      # The Makefile `ci` line and this workflow are two registries that must
      # agree: a check added to `make ci` does not run here unless a job step
      # runs it, and this workflow never calls `make ci`. corpus-check and
      # adr-index both shipped enforced-locally-only through exactly that gap.
      # This reconciles them mechanically -- every `ci` target must have its
      # command present in some job, or an allowlist entry with a reason.
      - name: Makefile ci line and this workflow agree
        run: python3 .github/scripts/check_ci_parity.py

      # The always-on half of the golden-corpus gate, and only that half: the
      # corpus is well-formed and every finding label agrees with the
      # containers' own account of themselves in lab/corpus/ground-truth.json.
      # No lab and no database here, so a drifted corpus fails on EVERY pull
      # request rather than waiting for the lab job. With no lab reachable the
      # step prints "6 metrics NOT MEASURED" and passes -- naming what it
      # skipped -- and the `corpus` job below is where those metrics are fatal.
      - name: Golden corpus labels (always-on half)
        run: make corpus-check

  web:
    name: Operator SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: internal/control/api/web/package-lock.json

      # Exactly the committed lockfile, so the build here is the build the
      # `ui-*` targets run locally.
      - name: Install the web toolchain
        run: make ui-deps

      # The generated client is a THIRD registry -- it must agree with the route
      # registry and this workflow. This regenerates the TypeScript types from
      # the OpenAPI the Route values emit (cmd/cvap-openapi) and fails on any
      # diff against the checked-in schema.ts, the same treatment proto-verify
      # gives gen/. A route added or reshaped without regenerating fails HERE.
      - name: Generated client matches the route registry
        run: make ui-verify

      - name: Typecheck
        run: make ui-typecheck

      - name: Unit tests
        run: make ui-test

      # The default `go build ./...` compiles the stub (spa_stub.go). This is the
      # only build that compiles the //go:build embedui files and links the SPA
      # bundle into cvap-core, so a broken embed path fails here and nowhere else.
      - name: cvap-core builds with the SPA embedded
        run: make embedui-build

  # The scan-and-diff half of the golden-corpus gate, where the six ADR §6.2
  # accuracy metrics are actually measured and enforced. The always-on config
  # step above proves the corpus is internally consistent; this job proves the
  # SCANNER agrees with it -- by scanning a real lab through the real engines
  # and correlator, never by reading the corpus back to itself.
  #
  # CVAP_REQUIRE_LAB=1 is the load-bearing line: it turns an absent lab from a
  # named skip into a failure, so this job cannot pass by quietly measuring
  # nothing. Without it, a runner where the lab failed to come up would print
  # "metrics NOT MEASURED" and go green -- the silent-no-op this whole gate
  # exists to refuse.
  corpus:
    name: Golden corpus (scan the lab, measure §6.2)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cvap
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: cvap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cvap -d cvap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The migration role owns the schema; the application role is a LOGIN
      # member of cvap_app holding neither BYPASSRLS nor SUPERUSER, which is
      # what the ingest connects as -- the same split the schema job uses.
      DATABASE_URL: postgres://cvap:ci-only-not-a-secret@127.0.0.1:5432/cvap?sslmode=disable
      APP_DATABASE_URL: postgres://cvap_app_login:cvap_dev_only_app_password@127.0.0.1:5432/cvap?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply migrations
        run: make migrate-up

      - name: Create the application login role
        run: make app-role

      # The 20-container lab across two internal segments. --wait blocks on each
      # target's healthcheck, so a target that never comes up fails HERE, loudly,
      # rather than being silently missed by the scan and counted as a recall gap.
      - name: Stand up the scan lab
        run: make lab-up

      # Both halves run (the always-on checks first, then the scan), with the
      # metrics FATAL. The engines run in throwaway containers on the lab
      # segments and the labels come from ground-truth.json; the two paths never
      # cross, so a green here is the scanner matching an independent ground
      # truth, not agreeing with itself.
      - name: Scan the lab and measure the six §6.2 metrics
        env:
          CVAP_REQUIRE_LAB: "1"
        run: make corpus-check

      - name: Tear down the lab
        if: always()
        run: make lab-down
