# CVAP scan lab: targets to point the scanner at during development.
#
# Two segments, matching lab/scope.txt. Both networks are `internal: true`,
# which means Docker installs no route to the outside: a misaimed scan cannot
# reach the internet even if every check in the code is wrong.
#
# That is the point. The lab-scope-guard hook and this network topology are two
# independent controls, not one control stated twice — the hook constrains what
# gets typed, the network constrains what can be reached. There is no route
# between segment A and segment B either, which is what makes multi-vantage
# exposure testable (ADR-008): the same target seen from two zones, or seen
# from only one.
#
# These are ordinary static web servers. Deliberately vulnerable targets and
# the golden corpus land in weeks 4 and 8; see docs/execution-plan.md 6.2.

name: cvap-lab

services:
  target-a1:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./targets/segment-a:/usr/share/nginx/html:ro
    networks:
      segment-a:
        ipv4_address: 10.10.0.11
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 5

  target-b1:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./targets/segment-b:/usr/share/nginx/html:ro
    networks:
      segment-b:
        ipv4_address: 10.20.0.11
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Segment A gets several more hosts, because "scan a /24 and see hosts in the
  # database" is not a deliverable two containers can demonstrate. These are
  # ordinary static servers on distinct addresses; what matters is that a sweep
  # finds a set rather than a single host.
  target-a2:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./targets/segment-a:/usr/share/nginx/html:ro
    networks:
      segment-a:
        ipv4_address: 10.10.0.12

  target-a3:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./targets/segment-a:/usr/share/nginx/html:ro
    networks:
      segment-a:
        ipv4_address: 10.10.0.13

  # An SSH server, so something in the lab VOLUNTEERS a banner. Everything else
  # here is HTTP, which says nothing until asked — so without this, safe mode
  # would produce no banner at all and the safe/intrusive distinction would be
  # untestable against the lab.
  target-a4:
    image: linuxserver/openssh-server:latest
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD_ACCESS=false
      - USER_NAME=lab
    networks:
      segment-a:
        ipv4_address: 10.10.0.14

  # The fragile one. See targets/slow/nginx.conf: it refuses above roughly ten
  # requests a minute rather than queueing, which is how ADR-024's 10 pps cap
  # becomes testable instead of being a number in a table.
  target-a-fragile:
    build: ./targets/slow
    restart: unless-stopped
    environment:
      - PORTS=80,443,8080,22,23,631
    networks:
      segment-a:
        ipv4_address: 10.10.0.20

  # The filtered host. See targets/filtered/Dockerfile: reachable at layer 2 and
  # silently dropping SYNs, which is the only way the SYN-retransmit path gets
  # exercised — every other target here answers or refuses instantly.
  target-a-filtered:
    build: ./targets/filtered
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    networks:
      segment-a:
        ipv4_address: 10.10.0.30

networks:
  segment-a:
    internal: true
    ipam:
      config:
        - subnet: 10.10.0.0/16
  segment-b:
    internal: true
    ipam:
      config:
        - subnet: 10.20.0.0/16
