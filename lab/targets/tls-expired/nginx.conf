# Only 443, and it sets the security headers, so the single finding is
# tls-certificate-expired — nothing from the HTTP header rules muddies it.
server {
    listen 443 ssl;
    server_name expired.lab.invalid;
    ssl_certificate     /certs/serve.crt;
    ssl_certificate_key /certs/leaf.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    location / { return 200 "expired\n"; }
}
