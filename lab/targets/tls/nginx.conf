# Both ports. 443 is the certificate; 80 is here so a discovery scan finds the
# host the same way it finds every other one, and the fingerprint engine has a
# plain port and a TLS port on one address to tell apart.
server {
    listen 80;
    server_name _;
    location / { return 200 "lab tls target\n"; }
}

server {
    listen 443 ssl;
    server_name lab-tls.invalid;

    ssl_certificate     /etc/ssl/certs/lab.crt;
    ssl_certificate_key /etc/ssl/private/lab.key;

    # Pinned so the negotiated-version assertion has something stable to assert.
    # A target that floats with the base image's defaults makes a test that
    # passes for a reason nobody chose.
    ssl_protocols TLSv1.2 TLSv1.3;

    location / { return 200 "lab tls target\n"; }
}
