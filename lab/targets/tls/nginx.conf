# 80 carries the HTTP-header findings (no headers, 200); 443 sets the headers so
# its only finding is tls-self-signed-non-dev. a5 also feeds the identity path
# (its cert has SANs) — that is why it, uniquely among TLS targets, keeps :80.
server { listen 80; server_name _; location / { return 200 "lab tls target\n"; } }
server {
    listen 443 ssl;
    server_name lab-tls.invalid;
    ssl_certificate     /etc/ssl/certs/lab.crt;
    ssl_certificate_key /etc/ssl/private/lab.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    location / { return 200 "lab tls target\n"; }
}
