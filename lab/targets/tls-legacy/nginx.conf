# nginx 1.14 offering only TLS 1.0. Headers set and no plain :80, so the single
# finding is tls-legacy-version-negotiated.
server {
    listen 443 ssl;
    server_name legacy.lab.invalid;
    ssl_certificate     /certs/serve.crt;
    ssl_certificate_key /certs/leaf.key;
    ssl_protocols TLSv1;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    location / { return 200 "legacy\n"; }
}
