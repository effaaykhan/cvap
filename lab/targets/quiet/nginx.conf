server {
    listen 80;
    server_name _;

    # server_tokens off is set in nginx.conf itself (see the Dockerfile), which
    # suppresses the version everywhere — the Server header, the error pages and
    # the 400 response. What it does NOT suppress is the shape: nginx emits
    # `Server: nginx` with no version, orders Date before Content-Type, and
    # answers a malformed request line with its own distinctive 400 page.
    location / { return 200 "quiet\n"; }
}
