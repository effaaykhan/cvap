# Plain HTTP that 301s to HTTPS. The NEGATIVE case: http-no-https-redirect must
# NOT fire (it redirects), and http-missing-security-headers must NOT fire (a
# redirect carries no content, so the rule skips it). This target proves the
# rules stay quiet when they should.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
