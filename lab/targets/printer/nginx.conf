# A listener on the NON-INERT ports, so the denylist is observable.
#
# It is not a printer and does not need to be. What the safety gate asserts is
# that no probe PAYLOAD is delivered to 9100 or 631 — and that assertion is
# vacuous unless something accepts the connection, because a refused connect
# cannot carry a payload whether the denylist works or not.
#
# On a real 9100, any bytes are a print job. Invariant 9: detection establishes
# evidence without achieving impact, and printing a page is impact.
server {
    listen 9100;
    listen 631;
    server_name _;
    location / { return 200 "not a printer, but it listens like one\n"; }
}
